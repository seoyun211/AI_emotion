name: flutter_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # 🔹 카메라
  camera: ^0.11.3

  # 🔊 오디오 녹음 + 파일 저장 + 권한
  record: ^6.1.2              # 최신 안정 버전
  path_provider: ^2.1.5       # getApplicationDocumentsDirectory()용
  permission_handler: ^11.4.0

  # 기본 패키지들
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.5
  shared_preferences: ^2.2.2

  # HTTP 통신
  dio: ^5.7.0
  http: ^1.6.0

  # 아바타 3D 표시용 패키지
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# ✅ flutter_launcher_icons 설정 (한 번만!)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/background/
    - assets/icon/
    - assets/avatar/
    - assets/model.glb
