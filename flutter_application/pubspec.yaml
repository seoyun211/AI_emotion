name: flutter_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # 기본 패키지들
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2

  # ✅ HTTP 통신용 Dio 패키지
  dio: ^5.7.0

  # ✅ 아바타 3D 표시용 패키지
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ✅ 앱 아이콘 생성용 패키지
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/background/
    - assets/icon/

# ✅ flutter_launcher_icons 설정
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
