<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      model-viewer {
        width: 100vw;
        height: 100vh;
        /* 🔥 살짝만 키우고, 아래를 기준으로 확대 */
        transform: scale(1.4);
        transform-origin: center bottom;
      }
    </style>
  </head>

  <body>
    <model-viewer
      id="avatar"
      src="assets/maldongs.glb"
      autoplay
      auto-rotate
      disable-zoom
      interaction-prompt="none"
      interaction-policy="none"
      exposure="1.0"
      shadow-intensity="1.0"
      environment-image="neutral"

      <!-- 🔥 여기서 카메라를 ‘가슴/얼굴 쪽’을 보는 위치로 고정 -->
      camera-controls
      camera-orbit="0deg 75deg 1.2m"
      camera-target="0m 1.4m 0m"
      field-of-view="18deg"
    >
    </model-viewer>

    <script>
      const avatar = document.getElementById("avatar");
      avatar.addEventListener("load", () => {
        console.log("avatar loaded");
      });

      window.blinkOnce = function () {
        console.log("blinkOnce() called from Flutter");
      };

      window.smile = function () {
        console.log("smile() called from Flutter");
      };
    </script>
  </body>
</html>
