buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Gradle Plugin 버전 업그레이드
        classpath 'com.android.tools.build:gradle:8.9.1'  // 최신 버전으로 업데이트
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10' // 최신 Kotlin 버전
    }
}


plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.flutter_application"
    compileSdk = 36  // 최신 SDK 버전

    ndkVersion = "26.1.10909125"  // NDK 버전 (최신 버전)

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.flutter_application"
        minSdkVersion = flutter.minSdkVersion  // 최소 SDK 버전 21 이상 (필요에 따라 수정)
        targetSdk = 36  // 목표 SDK 버전 36으로 설정
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug  // 개발용 디버그 키로 설정
        }
    }
}

flutter {
    source = "../.."  // Flutter SDK 경로 설정
}
