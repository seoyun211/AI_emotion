# 🔧 Gradle JVM 메모리 설정 (8GB 램 기준: 2G 정도가 적당)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2

# AndroidX 사용
android.useAndroidX=true

# Jetifier는 끄는 쪽 추천 (요즘 플러그인들은 거의 AndroidX라서)
android.enableJetifier=false

# HTTPS 설정
systemProp.https.protocols=TLSv1.2

# 🔧 병렬 worker 개수 줄여서 메모리 폭발 방지
org.gradle.workers.max=2

# (선택) Kotlin 코드 스타일
kotlin.code.style=official
