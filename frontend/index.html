<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말동이 - 노인 감정 분석 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="header">
            <h1>👵 말동이</h1>
            <p>노인 감정 분석 및 보호 시스템</p>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <!-- 감정 분석 섹션 -->
            <section class="emotion-section">
                <h2>감정 분석하기</h2>
                <div class="input-group">
                    <textarea id="textInput" placeholder="오늘 기분이 어때요? 말씀해주세요..." rows="4"></textarea>
                    <button id="analyzeBtn" class="btn-primary">감정 분석</button>
                </div>
            </section>

            <!-- 결과 표시 -->
            <section class="result-section hidden" id="resultSection">
                <h2>분석 결과</h2>
                <div class="result-card">
                    <div class="emotion-display" id="emotionDisplay">
                        <span class="emotion-icon" id="emotionIcon">😊</span>
                        <span class="emotion-text" id="emotionText">기쁨</span>
                    </div>
                    <div class="risk-level" id="riskLevel">
                        <div class="risk-bar">
                            <div class="risk-fill" id="riskFill"></div>
                        </div>
                        <span class="risk-text" id="riskText">위험도: 30%</span>
                    </div>
                    <div class="alert-status" id="alertStatus">
                        ✅ 안정적인 감정 상태입니다
                    </div>
                </div>
            </section>

            <!-- 사용자 정보 -->
            <section class="user-section">
                <h2>사용자 정보</h2>
                <div class="user-info">
                    <input type="text" id="userName" placeholder="이름" class="input-field">
                    <input type="tel" id="userPhone" placeholder="전화번호" class="input-field">
                    <input type="text" id="guardianPhone" placeholder="보호자 전화번호" class="input-field">
                    <button id="saveUserBtn" class="btn-secondary">정보 저장</button>
                </div>
            </section>

            <!-- 감정 기록 -->
            <section class="history-section">
                <h2>감정 기록</h2>
                <div class="history-list" id="historyList">
                    <!-- 기록이 여기에 동적으로 추가됨 -->
                </div>
            </section>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>© 2024 말동이 - 노인 케어 시스템</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
